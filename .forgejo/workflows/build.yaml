# Requires vars: OCI_REGISTRY
# Requires secrets: OCI_REGISTRY_USERNAME, OCI_REGISTRY_PASSWORD

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - labeled

jobs:
  changed:
    runs-on: wiecloud
    outputs:
      charts: ${{ steps.charts.outputs.charts }}
      tag: ${{ steps.tag.outputs.tag }}
      images: "[]"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get changed charts
        id: charts
        run: |
          git fetch origin "${{ forgejo.base_ref }}"
          echo

          echo "Getting diff...\n"
          diff=$(git diff origin/master --name-only --diff-filter=AMR | grep -E '^(infrastructure|applications|products)/.*/chart/') || diff=""

          echo "Extracting edited charts from diff...\n"
          edited_charts=$(printf '%s\n' "$diff"| sed 's|\(.*\/chart\)/.*|\1|' | sort -u)

          echo "Converting edited charts to json...\n"
          charts=$(echo $edited_charts | jq -R -s -c '
            split("\n")
            | map(select(length > 0))
            | map(split("/") | {path: join("/"), name: .[1], project: .[0]})
          ')

          echo "Changed charts:"
          echo $charts | jq
          echo "charts=$charts" >> "$FORGEJO_OUTPUT"

      - name: Generate tag
        id: tag
        run: |
          echo "Generating tag...\n"
          tag="${{ forgejo.head_ref }}-$(echo ${{ forgejo.sha }} | cut -c1-7)"

          # If label "Status/Ready for master" is set don't use a tag
          if echo '${{ toJSON(forgejo.event.issue.labels.*.name) }}' | grep -q "Status/Ready for master"; then
            tag=""
            echo "No tag set"
          fi

          echo "Tag is set to: ${tag}"
          echo "tag=$tag" >> "$FORGEJO_OUTPUT"

  publish-helm-chart:
    needs: [ changed ]
    runs-on: wiecloud
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJSON(needs.changed.outputs.charts) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to registry
        env:
          OCI_REGISTRY_USERNAME: ${{ secrets.OCI_REGISTRY_USERNAME }}
        run: |
          echo "Login in to ${{ vars.OCI_REGISTRY }}"
          helm registry login ${{ vars.OCI_REGISTRY }} --username "${OCI_REGISTRY_USERNAME}" --password "${{ secrets.OCI_REGISTRY_PASSWORD }}"

      - name: Package Helm chart
        id: package
        run: |
          echo "Building chart ${{ matrix.chart.name }} at ${{ matrix.chart.path }} with tag ${{ needs.changed.outputs.tag }}\n"
          output=$( ./pipeline/build/scripts/helm/helm_package.sh --path ${{ matrix.chart.path }} --tag "${{ needs.changed.outputs.tag }}" )
          echo

          packaged_path=$(echo "$output" | grep -oE '/[^ ]+\.tgz')

          echo "Packaged chart path: $packaged_path"
          echo "chart_package_path=$packaged_path" >> "$FORGEJO_OUTPUT"

      - name: Push Helm chart
        run: ./pipeline/build/scripts/helm/helm_push.sh --package ${{ steps.package.outputs.chart_package_path }} --registry ${{ vars.OCI_REGISTRY }} --repository ${{ matrix.chart.project }}

  update-versions:
    needs: [ changed, publish-helm-chart ]
    runs-on: wiecloud
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure git credentials
        run: |
          echo "Configuring git user: WiemanBot, email: bot@wieman.cloud"
          git config user.name "WiemanBot"
          git config user.email "bot@wieman.cloud"

      - name: Update versions
        run: |
          git fetch origin "${{ forgejo.base_ref }}"
          echo

          ./pipeline/version/scripts/update_versions.sh --charts '${{ needs.changed.outputs.charts }}' --tag "${{ needs.changed.outputs.tag }}"

      - name: Commit changes
        run: |
          git add .
          git commit -m "UPDATE: reference versions in wiecloud/chart/versions.yaml ${{ needs.changed.outputs.tag }}" || exit 0
          echo

          git push origin HEAD:${{ forgejo.head_Ref }} || exit 0
