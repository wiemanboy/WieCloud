network:
  hostname: wieman.cloud
  externalIp: 85.148.81.86
  ipPool:
    - 10.0.0.150 - 10.0.0.199
  gateway:
    name: default-envoy-gateway
    listener: https
    namespace: envoy-gateway
    certificate:
      email: wiemanboy@gmail.com
      issuerRef:
        name: letsencrypt
        kind: ClusterIssuer
      hostnames:
        - "wieman.cloud"
        - "*.wieman.cloud"
        - "*.s3.wieman.cloud"
        - "wiemanboy.com"
        - "*.wiemanboy.com"
        - "jarnowieman.com"
        - "*.jarnowieman.com"
        - "jarnowieman.nl"
        - "*.jarnowieman.nl"
        - "carnaval.lol"
        - "*.carnaval.lol"

auth:
  oidc:
    provider: Keycloak
    endpoint: https://keycloak.wieman.cloud/realms/wiecloud

backups:
  - name: local
    s3:
      endpoint: https://k8up.s3.wieman.cloud
      secret:
        name: local-backup-s3-credentials
        accessKey: accessKey
        secretKey: secretKey
        storeRef:
          kind: ClusterSecretStore
          name: local-backup-s3-credentials-store
    repo:
      secret:
        name: wiecloud/backup/local/password
        password: password
        storeRef:
          kind: ClusterSecretStore
          name: ovh
    schedule:
      backup: "0 12 * * *"
      check: "30 12 * * *"
      prune: "0 13 * * *"
    retention:
      keepLast: 5
      keepDaily: 14
  - name: ovh
    s3:
      endpoint: https://s3.gra.io.cloud.ovh.net
      secret:
        name: wiecloud/backup/ovh/s3
        accessKey: access_key
        secretKey: secret_key
        storeRef:
          kind: ClusterSecretStore
          name: ovh
    repo:
      secret:
        name: wiecloud/backup/ovh/password
        password: password
        storeRef:
          kind: ClusterSecretStore
          name: ovh
    schedule:
      backup: "0 12 * * *"
      check: "30 12 * * *"
      prune: "0 13 * * *"
    retention:
      keepLast: 5
      keepDaily: 14


targetRepository:
  url: https://github.com/wiemanboy/WieCloud.git
  branch: master

applications:
  forgejo:
    deploy: true
    cnpg:
      restore: false
    restores:
      - name: forgejo-restore
        enabled: false
        fromBackup: local
        snapshot: ""
        claim:
          name: gitea-shared-storage

  harbor:
    deploy: true
    cnpg:
      restore: false

  minecraft:
    deploy: true
    restores:
      - name: minecraft-restore
        enabled: false
        fromBackup: local
        snapshot: ""
        claim:
          name: minecraft-datadir
    world:
      name: cobble-create
      version: 1.21.1
    server:
      launcher: AUTO_CURSEFORGE
      version: java21
    bluemap:
      file: https://www.curseforge.com/minecraft/mc-mods/bluemap/files/6239407
    mods:
      voicechat:
        enabled: true
      vanillaTweaks: []
      modrinth:
        projects: []
      curseforge:
        zip:
          deploy: true
          file: https://next.wieman.cloud/public.php/dav/files/9cNAog5wjTWzPKb
        pageUrl: ""
        excludeMods: []
        includeMods: []

  nextcloud:
    deploy: true
    cnpg:
      restore: false
    restores:
      - name: nextcloud-restore
        enabled: false
        fromBackup: local
        snapshot: ""
        claim:
          name: nextcloud-nextcloud

  satisfactory:
    deploy: true
    restores:
      - name: server-files-restore
        enabled: false
        fromBackup: local
        snapshot: ""
        claim:
          name: satisfactory-server-files
      - name: config-restore
        enabled: false
        fromBackup: local
        snapshot: ""
        claim:
          name: satisfactory-config

  website:
    deploy: true
    namespace: website

  repository: harbor.wieman.cloud/applications

infrastructure:
  argocd:
    deploy: true

  certmanager:
    deploy: true

  cilium:
    deploy: true

  cnpg:
    deploy: true
    seaweedfs:
      backup:
        enabled: true
    restores:
      - name: seaweed-restore
        enabled: false
        fromBackup: local
        snapshot: ""
        claim:
          name: cnpg-backup-replicator

  crossplane:
    deploy: true

  dragonflydb:
    deploy: true

  envoygateway:
    deploy: true

  externaldns:
    deploy: true

  externalsecrets:
    deploy: true

  k8up:
    deploy: true

  keycloak:
    deploy: true
    clientCreationPermissions:
      - name: argocd
        namespace: argocd
      - name: forgejo
        namespace: forgejo
      - name: grafana
        namespace: prometheus
      - name: harbor
        namespace: harbor
      - name: longhorn
        namespace: longhorn-system
      - name: nextcloud
        namespace: nextcloud
    cnpg:
      restore: false
    tofudeployer:
      dryRun: true
    restores:
      - name: tfstate-restore
        enabled: false
        fromBackup: local
        snapshot: ""
        claim:
          name: tofudeployer-state

  kyverno:
    deploy: true

  longhorn:
    deploy: true
    routes:
      deploy: true

  metricsserver:
    deploy: true

  nodes:
    deploy: true
    api:
      proxmox: https://10.0.0.50:8006/api2/json
      routeros: http://10.0.0.1
    tofudeployer:
      dryRun: true
    restores:
      - name: tfstate-restore
        enabled: false
        fromBackup: local
        snapshot: ""
        claim:
          name: tofudeployer-state

  prometheus:
    deploy: true

  seaweedfs:
    deploy: true

  repository: harbor.wieman.cloud/infrastructure
