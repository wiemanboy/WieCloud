apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: ovh
  target:
    name: cloudflare-api-token
  data:
    - secretKey: token
      remoteRef:
        key: wiecloud/cloudflare/api
        property: token
