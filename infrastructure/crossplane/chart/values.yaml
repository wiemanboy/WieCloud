crossplane:
  function:
    packages:
    - xpkg.crossplane.io/crossplane-contrib/function-kcl:v0.12.3
    - xpkg.crossplane.io/crossplane-contrib/function-environment-configs:v0.9.0

  resourcesCrossplane:
    limits:
      cpu: null
      memory: 1024Mi
    requests:
      cpu: 100m
      memory: 256Mi

network:
  hostname: example.com
  gateway:
    name: example
    listener: example
    namespace: example

backups:
- name: example
  s3:
    endpoint: https://s3.example
    secret:
      name: example-s3-credentials
      accessKey: accessKey
      secretKey: secretKey
      storeRef:
        kind: ClusterSecretStore
        name: example-s3-credentials-store

  repo:
    secret:
      name: example-repo-password
      password: password
      storeRef:
        kind: ClusterSecretStore
        name: example-repo-password-store

  schedule:
    backup: "0 12 * * *"
    check: "30 12 * * *"
    prune: "0 13 * * *"

  retention:
    keepLast: 5
    keepDaily: 14
