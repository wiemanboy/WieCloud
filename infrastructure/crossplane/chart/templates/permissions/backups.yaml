apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backups-permissions
  labels:
    rbac.crossplane.io/aggregate-to-crossplane: "true"
rules:
  - apiGroups:
      - k8up.io
    resources:
      - schedules
      - schedules/status
      - restores
    verbs: [ get, list, watch, create, patch, update, delete ]
