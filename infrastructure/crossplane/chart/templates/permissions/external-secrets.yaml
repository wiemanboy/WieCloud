apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets-permissions
  labels:
    rbac.crossplane.io/aggregate-to-crossplane: "true"
rules:
  - apiGroups:
      - external-secrets.io/v1
    resources:
      - ExternalSecret
    verbs: [ get, list, watch, create, patch, update, delete ]
