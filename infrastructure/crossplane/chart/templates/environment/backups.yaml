apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: backups
data:
  backups:
  - name: local
    s3:
      endpoint: https://k8up.s3.wieman.cloud
      secret:
        name: local-backup-s3-credentials
        accessKey: accessKey
        secretKey: secretKey
        storeRef:
          kind: ClusterSecretStore
          name: local-backup-s3-credentials-store

    repo:
      secret:
        name: local-backup-repo-password
        key: password
        storeRef:
          kind: ClusterSecretStore
          name: local-backup-repo-password-store

    schedule:
      backup: "0 12 * * *"
      check: "30 12 * * *"
      prune: "0 13 * * *"

    retention:
      keepLast: 5
      keepDaily: 14
