apiVersion: wieman.cloud/v1
kind: Backup
metadata:
  name: test-backup
spec:
  enabled: true

  backup:
    bucket: wiemancloud-test-bucket
    # podSpec:
    #   podSecurityContext:
    #     runAsUser: 33
    #     fsGroup: 33
    #     fsGroupChangePolicy: OnRootMismatch

  restores:
    - name: test-restore
      enabled: false
      fromBackup: local
      snapshot: ""
      claim:
        name: test

status:
  targets:
  - name: local
    endpoint: https://k8up.s3.wieman.cloud
    schedule:
      backup: "0 12 * * *"
      check: "30 12 * * *"
      prune: "0 13 * * *"
    retention:
      keepLast: 5
      keepDaily: 14
