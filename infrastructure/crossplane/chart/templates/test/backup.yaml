apiVersion: wieman.cloud/v1
kind: Backup
metadata:
  name: test-backup
spec:
  enabled: true

  target:
    bucket: wiemancloud-test-bucket

  restores:
    - name: test-restore
      enabled: false
      fromBackup: local
      snapshot: ""
      claim:
        name: test

  backup:
    podSpec:
      securityContext:
        runAsUser: 33
        fsGroup: 33

status:
  targets:
  - name: local
    endpoint: https://k8up.s3.wieman.cloud
    schedule:
      backup: "0 12 * * *"
      check: "30 12 * * *"
      prune: "0 13 * * *"
    retention:
      keepLast: 5
      keepDaily: 14
