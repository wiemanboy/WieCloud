apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: my-app
  namespace: default
spec:
  parentRefs:
    - name: default-envoy-gateway
      sectionName: https
      namespace: envoy-gateway

  hostnames:
    - crossplane-app.wieman.cloud

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

      backendRefs:
        - name: my-app
          namespace: default
          port: 8080
