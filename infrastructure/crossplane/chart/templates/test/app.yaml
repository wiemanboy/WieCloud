apiVersion: wieman.cloud/v1
kind: App
metadata:
  namespace: default
  name: my-app
spec:
  image: nginx

  route:
    subdomain: my-app-domain
    hostnames:
      - also-my-app.wieman.cloud
    targetPort: 80

  resources:
    limits:
      memory: 252Mi
    requests:
      cpu: 1m
      memory: 126Mi
