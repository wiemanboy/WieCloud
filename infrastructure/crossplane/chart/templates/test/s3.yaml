apiVersion: wieman.cloud/v1
kind: S3
metadata:
  name: test
spec:
  endpoint: test.s3.wieman.cloud

  secret:
    name: test-s3-credentials
    store:
      name: test-s3-credentials-store

  master:
    replicas: 1
    resources:
      limits:
        memory: 64Mi
      requests:
        cpu: 1m
        memory: 32Mi

  volume:
    replicas: 1
    storage: 1Gi
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 5m
        memory: 64Mi

  filer:
    replicas: 1
    storage: 1Gi
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 5m
        memory: 128Mi

  replicator:
    enabled: false
    storage: 1Gi
    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 1m
        memory: 64Mi
