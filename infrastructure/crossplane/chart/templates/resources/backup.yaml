apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: backup
spec:
  compositeTypeRef:
    apiVersion: wieman.cloud/v1
    kind: Backup
  mode: Pipeline
  pipeline:
    - step: config
      functionRef:
        name: crossplane-contrib-function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: backups
    - step: deploy-resources
      functionRef:
        name: crossplane-contrib-function-kcl
      input:
        apiVersion: krm.kcl.dev/v1alpha1
        kind: KCLInput
        spec:
          source: |
            {{- .Files.Get "src/resources/backup/main.k" | nindent 12 }}
            items = compose(option("params"))
