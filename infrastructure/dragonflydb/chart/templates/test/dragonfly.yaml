apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dragonfly-sample
spec:
  replicas: 3
  args:
    - --proactor_threads=1
  resources:
    limits:
      memory: 320Mi
    requests:
      cpu: 50m
      memory: 256Mi
    authentication:
      passwordFromSecret:
        name: dragonfly-credentials
        key: password
