apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dragonfly-sample
spec:
  replicas: 3

  args:
    - --proactor_threads=1

  authentication:
    passwordFromSecret:
      name: dragonfly-credentials
      key: password

  resources:
    limits:
      memory: 320Mi
    requests:
      cpu: 50m
      memory: 256Mi
