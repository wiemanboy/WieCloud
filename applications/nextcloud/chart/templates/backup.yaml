apiVersion: wieman.cloud/v1
kind: Backup
metadata:
  name: nextcloud-backups
spec:
  {{- with .Values.backup }}
  enabled: {{ .enabled }}
  {{ end }}
  target:
    bucket: wiecloud-nextcloud-backups
  restores: {{ .Values.restores | default list | toYaml | nindent 4 }}
  backup:
    podSpec:
      securityContext:
        runAsUser: 33
        fsGroup: 33
