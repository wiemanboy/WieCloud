apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: ovh

  target:
    name: renovate-secrets

  data:
    - secretKey: RENOVATE_TOKEN
      remoteRef:
        key: wiecloud/renovate/forgejo
        property: token

    # - secretKey: RENOVATE_GITHUB_COM_TOKEN
