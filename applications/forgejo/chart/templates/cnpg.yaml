apiVersion: wieman.cloud/v1
kind: CNPG
metadata:
  name: forgejo-postgres-cluster
spec:
  database: forgejo
  instances: 3
  storage:
    size: 10Gi

  backup:
    {{- with .Values.cnpg }}
    restore: {{ .restore }}
    {{ end }}
    target:
      bucket: wiecloud-forgejo-postgres-backups

  resources:
    cnpg:
      limits:
        memory: 256Mi
      requests:
        cpu: 20m
        memory: 128Mi
    barman:
      limits:
        memory: 256Mi
      requests:
        cpu: 20m
        memory: 128Mi
