apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: forgejo-runner
  name: forgejo-runner
  namespace: {{ .Release.Namespace }}-runner-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: forgejo-runner
  template:
    metadata:
      labels:
        app: forgejo-runner
      annotations:
        runner-config-checksum: {{ include "forgejo.runner.configmap" . | sha256sum }}
    spec:
      initContainers:
      - name: dind
        {{ with .Values.images.dind.image -}}
        image: {{ .registry }}/{{ .repository }}:{{ .version }}
        {{ end -}}
        restartPolicy: Always
        command: ['dockerd', '-H', 'tcp://0.0.0.0:2375', '--tls=false']
        securityContext:
          privileged: true
        resources: {}

      containers:
        - name: forgejo-runner
          {{ with .Values.images.forgejorunner.image -}}
          image: {{ .registry }}/{{ .repository }}:{{ .version }}
          {{ end -}}

          env:
            - name: RUNNER_NAME
              value: {{ .Values.runner.config.name }}
            - name: RUNNER_INSTANCE
              value: {{ .Values.runner.config.instance }}
            - name: RUNNER_UUID
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner
                  key: uuid
            - name: RUNNER_SECRET
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner
                  key: secret

          command:
            - "sh"
            - "-c"
            - |
              cp /tmp/runner/config.yaml /etc/runner/config.yaml

              awk -v name="$RUNNER_NAME" -v url="$RUNNER_INSTANCE" -v uuid="$RUNNER_UUID" -v token="$RUNNER_SECRET" '
              /^  connections:/ && !done {
                print $0
                print "    " name ":"
                print "      url: " url
                print "      uuid: " uuid
                print "      token: " token
                done=1
                next
              }
              done && /^  [^ ]/ {
                done=0
              }
              done {
                next
              }
              1' /etc/runner/config.yaml > /etc/runner/config.yaml.tmp && mv /etc/runner/config.yaml.tmp /etc/runner/config.yaml

              while ! nc -z 127.0.0.1 2375 </dev/null; do
                echo 'waiting for docker daemon...'
                sleep 5
              done

              /bin/forgejo-runner --config /etc/runner/config.yaml daemon

          securityContext:
            privileged: true
          resources: {}
          volumeMounts:
            - name: runner
              mountPath: /etc/runner
            - name: runner-data
              mountPath: /data
            - name: runner-config
              mountPath: /tmp/runner

      volumes:
        - name: runner
          emptyDir: {}
        - name: runner-data
          emptyDir: {}
        - name: runner-config
          configMap:
            name: forgejo-runner-config
