apiVersion: v1
kind: ServiceAccount
metadata:
  name: create-runner
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: create-runner
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources:
      - jobs
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: create-runner
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: create-runner
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: create-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: create-runner-secret
  namespace: {{ .Release.Namespace }}-runner-system
rules:
  - apiGroups: [""]
    resources:
      - jobs
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: create-runner-secret
  namespace: {{ .Release.Namespace }}-runner-system
subjects:
  - kind: ServiceAccount
    name: create-runner
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: create-runner-secret
